<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Tree MVP</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#172033;--muted:#68738a;--line:#dfe5ef;--accent:#f5b82e;--accent-dark:#b77600;--blue:#4776e6;--green:#2aa876;--shadow:0 14px 40px rgba(28,43,75,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand h1{font-size:21px;margin:0 0 3px;letter-spacing:-.02em}.brand p{margin:0;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.search{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:230px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4776e622}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:650}.btn:hover{border-color:#b9c5d8;background:#f9fbff}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}.workspace{padding:24px 28px;min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}.toolbar h2{font-size:16px;margin:0}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.graph-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:auto;min-height:680px}.graph{position:relative;min-width:1100px;height:680px;padding:54px 36px}.tier-label{position:absolute;top:16px;color:#a0a9b8;font-weight:750;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{stroke:#cbd4e3;stroke-width:2;fill:none;transition:stroke .2s,stroke-width .2s}.edge.active{stroke:var(--accent-dark);stroke-width:4}.edge.future{stroke:#e8c66f;stroke-dasharray:6 5}.node{position:absolute;width:150px;min-height:72px;background:#fff;border:1.5px solid #d7dfeb;border-radius:12px;padding:11px 12px;cursor:pointer;box-shadow:0 5px 15px rgba(40,56,88,.06);transition:.2s;z-index:2}.node:hover{transform:translateY(-2px);border-color:#9cb5ee}.node.active{border-color:var(--accent-dark);box-shadow:0 0 0 4px #f5b82e33,0 8px 18px rgba(40,56,88,.12)}.node.path{border-color:#e1b13d;background:#fffaf0}.node.done{border-color:#84ccb0}.node-title{font-weight:750;font-size:13px}.node-meta{color:var(--muted);font-size:11px;margin-top:5px}.panel{background:#fff;border-left:1px solid var(--line);padding:26px 24px;overflow:auto}.panel-kicker{color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.panel h2{font-size:25px;line-height:1.1;margin:7px 0 9px}.panel p{color:var(--muted);margin:0 0 20px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 22px}.chip{background:#eef3ff;color:#3558ad;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:750}.section{border-top:1px solid var(--line);padding:18px 0}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}.prereqs{display:flex;flex-wrap:wrap;gap:7px}.prereq{border:1px solid #e7d08d;background:#fffaf0;border-radius:7px;padding:7px 9px;font-size:12px}.prompt{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;color:#39465d;white-space:pre-wrap;max-height:220px;overflow:auto}.panel .btn{width:100%;margin-top:10px}.status{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px;font-weight:750}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.search{flex:1;width:auto}.graph-wrap{min-height:560px}.graph{height:560px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>Data Analysis Concept Tree</h1><p>Click a concept to reveal the prerequisite path.</p></div><div class="top-actions"><input id="search" class="search" type="search" placeholder="Search concepts..." aria-label="Search concepts"><button id="reset" class="btn">Reset</button></div></header>
<main class="layout"><section class="workspace"><div class="toolbar"><h2>Learning map</h2><div class="legend"><span><i class="dot" style="background:#4776e6"></i>Concept</span><span><i class="dot" style="background:#f5b82e"></i>Selected path</span><span><i class="dot" style="background:#2aa876"></i>Completed</span></div></div><div id="graphWrap" class="graph-wrap"><div id="graph" class="graph"><svg id="edges" class="edges" aria-hidden="true"></svg><div class="tier-label" style="left:45px">Tier 1 · Foundations</div><div class="tier-label" style="left:280px">Tier 2 · Cleaning</div><div class="tier-label" style="left:515px">Tier 3 · Operations</div><div class="tier-label" style="left:750px">Tier 4 · Analysis</div><div class="tier-label" style="left:985px">Tier 5 · Insight</div></div></div></section><aside id="panel" class="panel" aria-live="polite"></aside></main>
</div>
<script>
const concepts=[
{id:'types',title:'Data types',tier:1,cat:'Foundations',desc:'Recognize numbers, text, dates, booleans, and categorical values.',x:45,y:105,done:true,pre:[]},
{id:'missing',title:'Missing values',tier:1,cat:'Foundations',desc:'Identify blanks and understand how they affect analysis.',x:45,y:260,pre:[]},
{id:'unique',title:'Unique values',tier:1,cat:'Foundations',desc:'Inspect distinct values to spot categories, labels, and anomalies.',x:45,y:415,pre:[]},
{id:'convert',title:'Convert types',tier:2,cat:'Cleaning',desc:'Convert fields into types that support reliable calculations.',x:280,y:145,pre:['types'],done:true},
{id:'handle-missing',title:'Handle missing data',tier:2,cat:'Cleaning',desc:'Choose whether to remove, fill, or flag missing observations.',x:280,y:360,pre:['missing']},
{id:'dedupe',title:'Deduplicate',tier:2,cat:'Cleaning',desc:'Find repeated records before counting or aggregating data.',x:280,y:515,pre:['unique']},
{id:'aggregate',title:'Aggregate',tier:3,cat:'Operations',desc:'Summarize rows using totals, averages, counts, or other measures.',x:515,y:165,pre:['convert','handle-missing']},
{id:'join',title:'Join tables',tier:3,cat:'Operations',desc:'Combine related tables through a shared key.',x:515,y:375,pre:['unique','dedupe']},
{id:'group',title:'Group by',tier:3,cat:'Operations',desc:'Split data into meaningful groups before calculating summaries.',x:515,y:535,pre:['aggregate','join']},
{id:'change',title:'Change over time',tier:4,cat:'Analysis',desc:'Compare how a metric changes across time periods, such as month-over-month, year-over-year, or growth percentage.',x:750,y:245,pre:['group','convert']},
{id:'correlation',title:'Correlation',tier:4,cat:'Analysis',desc:'Measure whether two variables move together and how strongly.',x:750,y:455,pre:['aggregate','group']},
{id:'trend',title:'Trend story',tier:5,cat:'Insight',desc:'Turn time-based analysis into a clear explanation of what changed and why.',x:985,y:245,pre:['change','correlation']}
];
const byId=Object.fromEntries(concepts.map(c=>[c.id,c]));let selected='change';
function ancestors(id,set=new Set()){if(!id||set.has(id))return set;set.add(id);(byId[id]?.pre||[]).forEach(p=>ancestors(p,set));return set}
function render(){const graph=document.querySelector('#graph');graph.querySelectorAll('.node').forEach(n=>n.remove());const q=document.querySelector('#search').value.toLowerCase();const path=ancestors(selected);const visible=concepts.filter(c=>!q||(`${c.title} ${c.cat} ${c.desc}`).toLowerCase().includes(q));
visible.forEach(c=>{const el=document.createElement('button');el.className='node '+(c.id===selected?'active ':'')+(path.has(c.id)&&c.id!==selected?'path ':'')+(c.done?'done':'');el.style.left=c.x+'px';el.style.top=c.y+'px';el.dataset.id=c.id;el.innerHTML=`<div class="node-title">${c.title}</div><div class="node-meta">${c.cat} · Tier ${c.tier}</div>`;el.onclick=()=>{selected=c.id;render()};graph.appendChild(el)});
const svg=document.querySelector('#edges');svg.innerHTML='';concepts.forEach(c=>c.pre.forEach(pid=>{const p=byId[pid];if(!p||q) return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',p.x+150);line.setAttribute('y1',p.y+36);line.setAttribute('x2',c.x);line.setAttribute('y2',c.y+36);line.classList.add('edge');if(path.has(c.id)&&path.has(pid))line.classList.add('active');else if(path.has(c.id)||path.has(pid))line.classList.add('future');svg.appendChild(line)}));renderPanel()}
function promptFor(c){return `You are a patient data-analysis tutor. Teach me “${c.title}” in simple language.\n\nExplain:\n- What it means and when to use it\n- A practical example with a small dataset\n- Common mistakes to avoid\n- How it connects to these prerequisites: ${(c.pre.length?c.pre.map(p=>byId[p].title).join(', '):'none')}\n\nEnd with a short exercise, then wait for my answer before grading it.`}
function renderPanel(){const c=byId[selected],path=ancestors(selected);document.querySelector('#panel').innerHTML=`<div class="panel-kicker">Selected concept</div><h2>${c.title}</h2><p>${c.desc}</p><div class="chips"><span class="chip">${c.cat}</span><span class="chip">Tier ${c.tier}</span>${c.done?'<span class="status">Completed</span>':''}</div><div class="section"><h3>Needs first</h3><div class="prereqs">${c.pre.length?c.pre.map(p=>`<span class="prereq">${byId[p].title}</span>`).join(''):'<span class="prereq">No prerequisites</span>'}</div></div><div class="section"><h3>Tutor prompt</h3><div class="prompt" id="prompt">${promptFor(c)}</div><button id="copy" class="btn primary">Copy prompt</button></div><div class="section"><h3>Path summary</h3><p>${[...path].reverse().map(id=>byId[id].title).join(' → ')}</p></div>`;document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(promptFor(c));const b=document.querySelector('#copy');b.textContent='Copied';setTimeout(()=>b.textContent='Copy prompt',1400)}}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#reset').onclick=()=>{selected='change';document.querySelector('#search').value='';render()};render();
</script>
</body>
</html>
